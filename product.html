<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the Edora Fashion product detail page." />
  <title>Product | Edora Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">Free shipping on orders over $100</div>

  <header class="site-header">
    <div class="container header-wrap">
      <button class="menu-toggle" aria-label="Open navigation">☰</button>
      <a href="index.html" class="brand">edora<span>.</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="shop.html" class="icon-link" aria-label="Browse products">⌕</a>
        <button class="icon-link bag-button" aria-label="Shopping bag">
          ♡
          <span class="badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="section product-detail-section">
      <div class="container product-detail" id="productDetail"></div>
    </section>

    <section class="section alt-bg related-section">
      <div class="container">
        <div class="section-heading split">
          <div>
            <p class="eyebrow">You may also like</p>
            <h2>More favorites</h2>
          </div>
          <a href="shop.html" class="text-link">View all</a>
        </div>
        <div class="product-grid" id="relatedProducts"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <a class="brand footer-brand" href="index.html">edora<span>.</span></a>
        <p>Modern essentials for everyday life.</p>
      </div>
      <div>
        <h3>Shop</h3>
        <a href="shop.html">New arrivals</a>
        <a href="shop.html?category=tops">Tops</a>
        <a href="shop.html?category=dresses">Dresses</a>
      </div>
      <div>
        <h3>About</h3>
        <a href="about.html">Our story</a>
        <a href="contact.html">Contact</a>
        <a href="shop.html">Journal</a>
      </div>
      <div>
        <h3>Support</h3>
        <a href="contact.html">Shipping</a>
        <a href="contact.html">Returns</a>
        <a href="contact.html">FAQ</a>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>© 2025 Edora Fashion</span>
      <span>hello@edorafashion.com</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
